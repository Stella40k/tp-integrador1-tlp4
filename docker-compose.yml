services:
  db:
    image: postgres:16-alpine
    container_name: tlp4-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-tlp4}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tlp4}
      POSTGRES_DB: ${DB_NAME:-tp_integrador}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
